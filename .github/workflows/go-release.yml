name: Go release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Validate Go release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v0\.[1-9][0-9]*\.[0-9]+(?:-(?:alpha|beta|rc)\.[1-9][0-9]*)?$') { throw 'Expected a Go v0.x.y or numbered alpha/beta/rc tag; old npm tags are not Go releases.' }
          $module = go list -m
          if ($LASTEXITCODE -ne 0 -or $module -ne 'github.com/wooto/lol-replay-recorder') { throw 'Invalid module path' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must be on main' }
      - run: go mod verify
      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = @(& gofmt -l @(git ls-files '*.go'))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -gt 0) { $unformatted; exit 1 }
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build ./...
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - run: go test -race -count=1 ./...
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
          GOOS=windows GOARCH=amd64 govulncheck ./...
  publish:
    needs: [verify, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish experimental prereleases; keep stable versions as drafts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          options=(--title "$RELEASE_TAG" --verify-tag)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease --latest=false)
          else
            options+=(--draft)
          fi
          notes="docs/releases/$RELEASE_TAG.md"
          if [[ -f "$notes" ]]; then
            options+=(--notes-file "$notes")
          else
            options+=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" "${options[@]}"
